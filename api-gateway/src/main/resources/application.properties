spring.config.import=optional:file:.env[.properties]
server.port=8080
spring.application.name=api-gateway

eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

jwt.secret=${JWT_SECRET}

name.admin=ADMIN

spring.cloud.gateway.routes[0].id=Booking
spring.cloud.gateway.routes[0].uri=lb://Booking
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**,/oauth2/**,/login/**


spring.cloud.gateway.routes[1].id=bus-service
spring.cloud.gateway.routes[1].uri=lb://bus-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/bus/**


spring.cloud.gateway.routes[2].id=booking-service
spring.cloud.gateway.routes[2].uri=lb://booking-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/booking/**




management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always